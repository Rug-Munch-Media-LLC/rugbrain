[project]
name = "rugbrain"
version = "0.1.0"
description = "RugBrain (formerly RugSense / RMI RAG) — crypto intelligence RAG engine with real-time security alert ingestion, market awareness, and hybrid retrieval"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1.0",
    "fastapi>=0.115.0",
    "fastembed>=0.8.0",
    "httpx>=0.27.0",
    "numpy>=1.26.0,<2.0",
    "pyarrow>=17.0.0",
    "pydantic>=2.9.0",
    "pytz>=2024.1",
    "redis>=5.2.0",
    "qdrant-client>=1.13.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "vulture>=2.16",
    "radon>=6.0",
    "interrogate>=1.7",
    "deptry>=0.25",
    "pip-audit>=2.10",
    "respx>=0.21.0",
    "import-linter>=2.0",
]
# Real-time alert ingestion extras (alerts.py, market_awareness.py).
alerts = [
    "nats-py>=2.9.0",
    "clickhouse-connect>=0.8.0",
]
# Intelligent web crawling extras (web_crawler.py). Optional: the crawler
# degrades to plain HTTP extraction when crawl4ai is not installed.
crawl = [
    "crawl4ai>=0.9.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
markers = [
    "integration: cross-service integration tests (require external services running)",
]
asyncio_mode = "auto"
testpaths = ["tests"]
# Prepend the in-tree src/ so tests always exercise THIS checkout. Without it a
# globally-installed editable install (rugbrain.pth) can shadow the working tree
# and silently test the wrong code — which is what happened in agent worktrees.
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["rugbrain*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "RUF", "ASYNC", "S"]
ignore = ["E501", "B008", "S101", "N818", "S110", "S112", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Tests use deliberate importlib-import patterns and unused loop vars for data-driven asserts
"tests/*" = ["E402", "B007"]
"src/rugbrain/firehose/direct_sources.py" = ["S314"]

[tool.mypy]
python_version = "3.12"
strict = true
# Keep in sync with the lefthook pre-push gate (`mypy src/ --ignore-missing-imports`):
# third-party stubs (streamlit, feedparser, ...) are not all typed.
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unreachable = true

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 60

[tool.deptry]
ignore = ["DEP002", "DEP003"]

[tool.interrogate]
fail-under = 50
ignore-init-method = true
ignore-init-module = true
exclude = ["tests/*", "setup.py"]

[tool.mutmut]
source_paths = ["src/rugbrain"]
pytest_add_cli_args_test_selection = ["tests/test_guardrails.py", "tests/test_confidence_scorer.py", "--deselect", "tests/test_guardrails.py::test_mcp_bridge_guard_helpers_exist"]
