[project]
name = "rmi-rag"
version = "0.1.0"
description = "RMI RAG — hybrid search, embeddings, chunking, agentic retrieval for crypto intelligence"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "numpy>=1.26.0,<2.0",
    "pydantic>=2.9.0",
    "redis>=5.2.0",
    "qdrant-client>=1.13.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "vulture>=2.16",
    "radon>=6.0",
    "interrogate>=1.7",
    "deptry>=0.25",
    "pip-audit>=2.10",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
markers = [
    "integration: cross-service integration tests (require external services running)",
]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["rmi_rag*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "RUF", "ASYNC", "S"]
ignore = ["E501", "B008", "S101", "N818"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = false
warn_unused_configs = true
warn_redundant_casts = true
warn_unreachable = true

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 60

[tool.deptry]
ignore = ["DEP002", "DEP003"]

[tool.interrogate]
fail-under = 50
ignore-init-method = true
ignore-init-module = true
exclude = ["tests/*", "setup.py"]
