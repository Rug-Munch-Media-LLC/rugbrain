[project]
name = "rmi-rag"
version = "0.1.0"
description = "RMI RAG — hybrid search, embeddings, chunking, agentic retrieval for crypto intelligence"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "numpy>=1.26.0,<2.0",
    "pydantic>=2.9.0",
    "redis>=5.2.0",
    "qdrant-client>=1.13.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["rmi_rag*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "RUF", "ASYNC", "S"]
ignore = ["E501", "B008", "S101", "N818"]
