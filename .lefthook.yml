# ── RugMunch CANONICAL Lefthook Configuration ─────────────────
# Source of truth: standards/lefthook.yml
# ALL repos symlink .lefthook.yml -> ../standards/lefthook.yml
#
# This single config handles ALL repo types via glob patterns:
#   *.py              -> ruff, vulture, radon, interrogate, pip-audit, semgrep, pyright (Python repos)
#   *.{ts,tsx,js,jsx} -> biome, oxlint, tsc, knip, attw (Frontend repos)
#   package.json      -> publint (Frontend repos)
#   *.sh              -> shellcheck (Infra repos)
#   Dockerfile*       -> hadolint (Infra repos)
#   *.sql             -> squawk (DB migration repos)
#
# Quick install:
#   lefthook install
#   lefthook run pre-commit    # test hooks
#   lefthook run pre-push      # test push hooks
#
# NOTE: --no-verify bypasses client hooks. Server-side CI is the real gate.
#
# Full tool roster:
#   Python lint:        ruff, mypy, pyright, bandit, semgrep
#   Python quality:     vulture (dead code), radon (complexity), interrogate (docstrings)
#   Python deps:        deptry (freshness), pip-audit (vulnerabilities)
#   Frontend lint:      biome, oxlint, tsc --noEmit
#   Frontend quality:   knip (dead code), publint (pkg.json), attw (type exports)
#   Container/Infra:    hadolint (Dockerfile), shellcheck (.sh), squawk (.sql)
#   Security universal: gitleaks, envsitter, methodology-leak
#
# HOW TO ADD REPO-SPECIFIC OVERRIDES:
# If a repo needs EXTRA hooks on top of canonical, create
# .lefthook.local.yml in the repo root. Lefthook merges it
# automatically. Example:
#
#   pre-commit:
#     commands:
#       my-custom-check:
#         run: ./scripts/my-check.sh

pre-commit:
  parallel: true
  commands:
    # -- Methodology leak detection (UNIVERSAL) -----------------
    methodology-leak:
      run: bash scripts/pre-commit-methodology-check.sh
      skip:
        - merge
        - rebase

    # -- BLOCK .env files (UNIVERSAL) --------------------------
    no-env-files:
      run: |
        if find . -maxdepth 3 -name '.env' -not -name '.env.example' \
          -not -path './.git/*' \
          -not -path '*/node_modules/*' \
          -not -path '*/venv/*' \
          -not -path '*/.venv/*' \
          -not -path '*/__pycache__/*' \
          -not -path '*/bridge/.env' \
          -not -path './dockflare/.env' \
          | grep -q .; then
          echo "ERROR: .env files found. Move secrets to gopass."
          echo "       Run: gopass show <path>"
          exit 1
        fi
      skip:
        - merge
        - rebase

    # -- Secret scanning (UNIVERSAL) ---------------------------
    # Uses per-repo .gitleaks.toml (supports repo-specific allowlists);
    # falls back to canonical standards config.
    gitleaks:
      run: |
        if [ -f .gitleaks.toml ]; then
          gitleaks protect --staged --config .gitleaks.toml --verbose
        elif [ -f ../standards/.gitleaks.toml ]; then
          gitleaks protect --staged --config ../standards/.gitleaks.toml --verbose
        fi

    # -- envsitter validation (UNIVERSAL) ----------------------
    envsitter:
      run: envsitter validate --file .env 2>/dev/null || true

    # -- Python lint (PYTHON repos) ---------------------------
    ruff:
      glob: "*.py"
      run: ruff check --fix {staged_files} && ruff format {staged_files}
      stage_fixed: true

    # -- Python dead code detection (PYTHON repos) -------------
    vulture:
      glob: "*.py"
      run: vulture {staged_files} 2>/dev/null || echo "vulture check complete (see warnings above)"

    # -- Python complexity analysis (PYTHON repos) -------------
    radon:
      glob: "*.py"
      run: radon cc {staged_files} -a -nb 2>/dev/null || true

    # -- Python docstring coverage (PYTHON repos) --------------
    interrogate:
      glob: "*.py"
      run: "interrogate {staged_files} --fail-under=60 2>/dev/null || echo 'interrogate: docstring coverage below threshold'"

    # -- Dependency vulnerability scan (PYTHON repos) ----------
    pip-audit:
      glob: "*.py"
      run: |
        if [ -f "requirements*.txt" ] || [ -f "pyproject.toml" ]; then
          pip-audit --severity high --desc 2>/dev/null || echo "pip-audit: vulnerabilities found (run manually to review)"
        fi

    # -- SAST via semgrep (PYTHON repos) -----------------------
    semgrep:
      glob: "*.py"
      run: |
        if [ -f ".semgrep.yml" ] || [ -f ".semgrep.toml" ]; then
          semgrep --config=auto --metrics=off --error --quiet {staged_files} 2>/dev/null || true
        fi

    # -- Python type check via pyright (PYTHON repos, faster alternative) --
    pyright:
      glob: "*.py"
      run: |
        if [ -f "pyproject.toml" ] && command -v pyright &>/dev/null; then
          pyright {staged_files} 2>/dev/null || true
        fi

    # -- Frontend lint (FRONTEND repos) -----------------------
    biome:
      glob: "*.{ts,tsx,js,jsx,json,css}"
      run: npx biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true

    oxlint:
      glob: "*.{ts,tsx,js,jsx}"
      run: npx oxlint@latest --max-warnings=0 {staged_files}

    # -- Frontend package.json validation (FRONTEND repos) -----
    publint:
      glob: "package.json"
      run: npx publint@latest 2>/dev/null || true

    # -- Frontend type export validation (FRONTEND repos) ------
    attw:
      glob: "*.{ts,tsx}"
      run: |
        if [ -f "package.json" ]; then
          npx attw@latest --pack . 2>/dev/null || true
        fi

    # -- Shell lint (INFRA repos) -----------------------------
    shellcheck:
      glob: "*.sh"
      run: shellcheck {staged_files}

    # -- Dockerfile lint (INFRA repos) ------------------------
    hadolint:
      glob: "Dockerfile*"
      run: hadolint {staged_files}

    # -- SQL migration lint (DB repos) ------------------------
    squawk:
      glob: "*.sql"
      run: squawk {staged_files} 2>/dev/null || echo "Squawk not available — skipping SQL lint"

pre-push:
  parallel: true
  commands:
    # -- Methodology leak detection (UNIVERSAL) -----------------
    methodology-leak:
      run: bash scripts/pre-commit-methodology-check.sh

    # -- Full-repo secret scan (UNIVERSAL) --------------------
    # Uses per-repo .gitleaks.toml (supports repo-specific allowlists);
    # falls back to canonical standards config.
    gitleaks-full:
      run: |
        if [ -f .gitleaks.toml ]; then
          gitleaks detect --source . --no-git --config .gitleaks.toml -v
        elif [ -f ../standards/.gitleaks.toml ]; then
          gitleaks detect --source . --no-git --config ../standards/.gitleaks.toml -v
        fi

    # -- Python type check (PYTHON repos) ---------------------
    # Prefer the project's venv mypy (matches CI) so a stale global
    # /usr/local/bin/mypy with older type stubs can't disagree with the
    # version pinned in pyproject.toml.
    mypy:
      glob: "*.py"
      run: |
        MYPY_BIN="mypy"
        if [ -x ".venv/bin/mypy" ]; then MYPY_BIN=".venv/bin/mypy"; fi
        # Incremental: only .py files in this push ({all_files} = lefthook template).
        # Full-src has 1.6k pre-existing errors — full-dir gate can never pass.
        PYFILES=$(printf '%s\n' {all_files} | grep '^src/.*\.py$' | grep -v '^tests/' || true)
        if [ -n "$PYFILES" ]; then
          "$MYPY_BIN" $PYFILES --ignore-missing-imports --follow-imports=silent
        fi

    # -- Python type check via pyright (PYTHON repos, faster alternative) --
    pyright:
      glob: "*.py"
      run: |
        if command -v pyright &>/dev/null; then
          pyright . 2>/dev/null || true
        fi

    # -- Python security scan (PYTHON repos) ------------------
    bandit:
      glob: "*.py"
      run: |
        # Incremental: only .py files in this push ({all_files} = lefthook template).
        PYFILES=$(printf '%s\n' {all_files} | grep '^src/.*\.py$' | tr '\n' ' ' || true)
        if [ -n "$PYFILES" ]; then
          bandit -r $PYFILES -ll
        elif [ -d "app/" ]; then
          bandit -r app/ -ll
        elif [ -d "src/" ]; then
          bandit -r src/ -ll
        fi

    # -- Python dep freshness (PYTHON repos) ------------------
    deptry:
      glob: "*.py"
      run: deptry . 2>/dev/null || echo "deptry not available — skipping"

    # -- Python dep vulnerability scan (PYTHON repos) ---------
    pip-audit:
      glob: "*.py"
      run: |
        if [ -f "requirements*.txt" ] || [ -f "pyproject.toml" ]; then
          pip-audit --severity high 2>/dev/null || true
        fi

    # -- Python dead code full scan (PYTHON repos) ------------
    vulture:
      glob: "*.py"
      run: |
        if [ -d "app/" ]; then
          vulture app/ --min-confidence 80 2>/dev/null || true
        elif [ -d "src/" ]; then
          vulture src/ --min-confidence 80 2>/dev/null || true
        fi

    # -- Python docstring coverage full scan (PYTHON repos) ---
    interrogate:
      glob: "*.py"
      run: |
        if [ -d "app/" ]; then
          interrogate app/ --fail-under=60 2>/dev/null || true
        elif [ -d "src/" ]; then
          interrogate src/ --fail-under=60 2>/dev/null || true
        fi

    # -- SAST full scan via semgrep (PYTHON/FRONTEND repos) ---
    semgrep:
      run: |
        if [ -f ".semgrep.yml" ] || [ -f ".semgrep.toml" ]; then
          semgrep --config=auto --metrics=off --error . 2>/dev/null || true
        fi

    # -- Frontend type check (FRONTEND repos) -----------------
    typecheck:
      glob: "*.{ts,tsx}"
      run: |
        if [ -f "tsconfig.json" ]; then
          npx tsc --noEmit
        fi

    # -- Frontend type export validation (FRONTEND repos) -----
    attw:
      glob: "*.{ts,tsx}"
      run: |
        if [ -f "package.json" ]; then
          npx attw@latest --pack . 2>/dev/null || true
        fi

    # -- Run tests (ALL repos — detect runner) ----------------
    test:
      run: |
        if [ -f "pyproject.toml" ] || [ -f "setup.py" ] || [ -f "setup.cfg" ]; then
          python3 -m pytest tests/ -x -q -m "not integration" 2>/dev/null || true
        elif [ -f "vitest.config.ts" ] || [ -f "vitest.config.js" ]; then
          npx vitest run --reporter=verbose 2>/dev/null || true
        elif [ -f "jest.config.ts" ] || [ -f "jest.config.js" ]; then
          npx jest --passWithNoTests 2>/dev/null || true
        fi
      skip:
        - merge

    # -- Frontend dep audit (FRONTEND repos) ------------------
    audit:
      glob: "package.json"
      run: pnpm audit --prod --audit-level=high 2>/dev/null || npm audit --production --audit-level=high 2>/dev/null || true

    # -- Frontend dead code (FRONTEND repos) ------------------
    knip:
      glob: "*.{ts,tsx}"
      run: npx knip --no-progress 2>/dev/null || true

    # -- Frontend package.json validation (FRONTEND repos) -----
    publint:
      glob: "package.json"
      run: npx publint@latest 2>/dev/null || true

commit-msg:
  commands:
    commitlint:
      run: commitlint --edit "$1"
