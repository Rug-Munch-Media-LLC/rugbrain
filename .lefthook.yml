pre-commit:
  parallel: true
  commands:
    gitleaks:
      run: gitleaks protect --staged --no-banner --verbose
    envsitter:
      run: envsitter validate
    ruff:
      run: ruff check {staged_files}

pre-push:
  parallel: true
  commands:
    mypy:
      run: mypy .
    bandit:
      run: bandit -c pyproject.toml -r .
    deptry:
      run: deptry .

commit-msg:
  commands:
    commitlint:
      run: commitlint --edit "$1"
