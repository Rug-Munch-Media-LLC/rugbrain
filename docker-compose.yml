# rugbrain docker-compose
# Two modes:
#   rag-api     — FastAPI server (default, always-on)
#   rag-ingest  — One-shot threat ingest (run via: docker compose run --rm rag-ingest)
#
# Deploy: cd [REPO_DIR] && docker compose up -d
networks:
  rmi_network:
    external: true

services:
  # ── API server (always-on) ──────────────────────────────────────
  rag-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rugbrain-api
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    labels:
      - "dockflare.enable=true"
      - "dockflare.hostname=rag.rugmunch.io"
      - "dockflare.service=http://rugbrain-api:8012"
      - "dockflare.zonename=rugmunch.io"
      - app.rugmunch.io/name=rugbrain-api
      - app.rugmunch.io/role=api
      - app.rugmunch.io/description=RAG retrieval API
    ports:
      - "127.0.0.1:8012:8012"
    env_file:
      - .env.rag
    networks:
      - rmi_network
    volumes:
      # NOTE: reranking now uses the self-hosted Qwen3-Reranker-8B (llama.cpp:8003).
      # NOTE: served from /path/to/hf-cache (world-readable) and mounted
      # at /opt/hf-cache (NOT /root/.cache) because the image's /root is 0700
      # root-owned — the non-root container user (rmi, uid 999) cannot traverse
      # into /root to reach the mount point. HF_HOME is set to /opt/hf-cache.
      - /path/to/hf-cache:/opt/hf-cache:ro
      # Rclone config for chain-parquet B2 access (b2-crypt remote). The
      # container runs as non-root rmi (uid 999), so the source file must be
      # world-readable (chmod 644 — /root is 0700 so only root can traverse
      # to it on the host). RCLONE_CONF (set above) points rclone at
      # /home/rmi/.config/rclone/rclone.conf. Set RCLONE_CONF_SOURCE to the
      # host rclone config path at deploy time (no .env files in this repo —
      # fleet no-env-files hook; e.g. RCLONE_CONF_SOURCE=... docker compose
      # up -d rag-api).
      - ${RCLONE_CONF_SOURCE:-/path/to/rclone.conf}:/home/rmi/.config/rclone/rclone.conf:ro
    environment:
      - QDRANT_URL=http://rmi-qdrant-v2:6333
      - QDRANT_HOST=rmi-qdrant-v2
      - QDRANT_PORT=6333
      - REDIS_HOST=rmi-redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-RMI_PROD_REDIS_2026}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-}
      - LANGFUSE_HOST=http://rmi-langfuse:3000
      - OTEL_ENABLED=true
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://rmi-otel-collector:4317
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - HF_HOME=/opt/hf-cache
      - QWEN_EMBED_URL=http://172.22.0.1:8004/v1
      # Embedding provider (qwen3-embedding-4b, 2560d): EMBED_PROVIDER=local
      # (llama.cpp :8004 above) or deepinfra (hosted Qwen/Qwen3-Embedding-4B,
      # massive-scale). DEEPINFRA_API_KEY is supplied via .env.rag / gopass —
      # flip EMBED_PROVIDER=deepinfra only once the key is present there.
      - EMBED_PROVIDER=${EMBED_PROVIDER:-local}
      - DEEPINFRA_EMBED_URL=${DEEPINFRA_EMBED_URL:-https://api.deepinfra.com/v1}
      - DEEPINFRA_EMBED_MODEL=${DEEPINFRA_EMBED_MODEL:-Qwen/Qwen3-Embedding-4B}
      - RERANKER_URL=http://172.22.0.1:8003
      - RERANKER_TIMEOUT=30
      - PRESIDIO_URL=http://presidio:8090
      # DuckDB query endpoint (/api/v1/rag/query) — B2 permanence snapshots.
      # B2_APPLICATION_KEY_ID / B2_APPLICATION_KEY are required for the
      # endpoint; B2_S3_ENDPOINT defaults to s3.us-east-005.backblazeb2.com.
      # Supplied via env_file (.env.rag) — no bare .env in the repo (fleet
      # no-env-files hook; secrets sourced from gopass).
      #
      # Chain-data query endpoint (/api/v1/rag/chain/query) — chain-indexer
      # parquet at b2-crypt:chain-data/parquet/. The b2-crypt remote is
      # rclone-crypt encrypted, so the container needs rclone + a config
      # with the b2-crypt remote. Provide RCLONE_CONF (mounted config) or
      # RCLONE_CONFIG_* env vars (crypt + underlying b2 remotes).
      - RCLONE_CONF=${RCLONE_CONF:-/home/rmi/.config/rclone/rclone.conf}
      - B2_CHAIN_DATA_REMOTE=${B2_CHAIN_DATA_REMOTE:-b2-crypt}
      - B2_CHAIN_DATA_BUCKET=${B2_CHAIN_DATA_BUCKET:-chain-data}
      - B2_CHAIN_DATA_PREFIX=${B2_CHAIN_DATA_PREFIX:-parquet}
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: "1g"
        reservations:
          cpus: "0.5"
          memory: "512m"
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; r = httpx.get('http://localhost:8012/ready'); exit(0 if r.status_code == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── Threat ingest (one-shot) ────────────────────────────────────
  rag-ingest:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rugbrain-ingest
    restart: "no"
    profiles:
      - ingest
    networks:
      - rmi_network
    environment:
      - QDRANT_URL=http://rmi-qdrant-v2:6333
      - QDRANT_HOST=rmi-qdrant-v2
      - QDRANT_PORT=6333
      - REDIS_HOST=rmi-redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-RMI_PROD_REDIS_2026}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-}
      - LANGFUSE_HOST=http://rmi-langfuse:3000
      - OTEL_ENABLED=true
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://rmi-otel-collector:4317
      - HF_HOME=/opt/hf-cache
      - QWEN_EMBED_URL=http://172.22.0.1:8004/v1
      # Embedding provider — see rag-api service for semantics.
      # rag-ingest is the BULK worker: default to DeepInfra (same model,
      # ~80x faster) so heavy ingestion never saturates the local server.
      - EMBED_PROVIDER=${EMBED_PROVIDER:-deepinfra}
      - DEEPINFRA_EMBED_URL=${DEEPINFRA_EMBED_URL:-https://api.deepinfra.com/v1}
      - DEEPINFRA_EMBED_MODEL=${DEEPINFRA_EMBED_MODEL:-Qwen/Qwen3-Embedding-4B}
    volumes:
      - /path/to/hf-cache:/opt/hf-cache:ro
    command: python scripts/ingest_threats.py
    labels:
      - app.rugmunch.io/name=rugbrain-ingest
      - app.rugmunch.io/role=worker
      - app.rugmunch.io/description=RAG ingestion worker

  # ── PII Redaction Service (Presidio) ────────────────────────────
  presidio:
    build:
      context: .
      dockerfile: presidio.Dockerfile
    container_name: rugbrain-presidio
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - rmi_network
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "256m"
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; r = httpx.get('http://localhost:8090/health'); exit(0 if r.status_code == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Web Dashboard (Streamlit) ───────────────────────────────────
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rugbrain-dashboard
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:8501:8501"
    networks:
      - rmi_network
    environment:
      - RAG_API_URL=http://rugbrain-api:8012
      - PRESIDIO_URL=http://presidio:8090
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_SERVER_HEADLESS=true
    # Override Dockerfile HEALTHCHECK (targets the API's 8012/ready — wrong
    # service). Streamlit exposes /_stcore/health on its own port.
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request as u; r = u.urlopen('http://localhost:8501/_stcore/health', timeout=5); exit(0 if r.status == 200 else 1)\" || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    command: >
      sh -c "pip install --upgrade pip --quiet && pip install streamlit --quiet && python3 -m streamlit run /app/src/rugbrain/dashboard.py --server.port 8501 --server.headless true --server.address 0.0.0.0"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "512m"
    depends_on:
      - rag-api
      - presidio
