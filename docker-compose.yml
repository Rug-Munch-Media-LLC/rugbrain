# rmi-rag docker-compose
# Two modes:
#   rag-api     — FastAPI server (default, always-on)
#   rag-ingest  — One-shot threat ingest (run via: docker compose run --rm rag-ingest)
#
# Deploy: cd [REPO_DIR] && docker compose up -d
networks:
  rmi_network:
    external: true

services:
  # ── Ollama embedding server ────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: rmi-ollama
    restart: unless-stopped
    networks:
      - rmi_network
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - /usr/share/ollama/.ollama/models:/root/.ollama/models
      # Post-start warmup: pre-loads bge-m3 + nomic-embed-text so the
      # first RAG search doesn't pay a 30-45s cold-start penalty.
      - ./scripts/ollama-warmup.sh:/opt/ollama-warmup.sh:ro
    entrypoint: ["/bin/bash", "/opt/ollama-warmup.sh"]
    command: []
    environment:
      - OLLAMA_NUM_PARALLEL=2
      - OLLAMA_NUM_THREADS=2
      - OLLAMA_CONTEXT_LENGTH=4096
      - OLLAMA_KEEP_ALIVE=-1
      - OLLAMA_FLASH_ATTENTION=1
      - OLLAMA_KV_CACHE_TYPE=q8_0
      - OLLAMA_MAX_LOADED_MODELS=2
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: "4g"
        reservations:
          cpus: "1"
          memory: "2g"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── API server (always-on) ──────────────────────────────────────
    labels:
      - app.rugmunch.io/name=rmi-ollama
      - app.rugmunch.io/role=inference
      - app.rugmunch.io/description=Ollama local LLM inference
  rag-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rmi-rag-api
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    labels:
      - "dockflare.enable=true"
      - "dockflare.hostname=rag.rugmunch.io"
      - "dockflare.service=http://rmi-rag-api:8012"
      - "dockflare.zonename=rugmunch.io"
      - app.rugmunch.io/name=rmi-rag-api
      - app.rugmunch.io/role=api
      - app.rugmunch.io/description=RAG retrieval API
    ports:
      - "127.0.0.1:8012:8012"
    env_file:
      - .env.rag
    networks:
      - rmi_network
    volumes:
      # Shared HF cache: bge-reranker-v2-m3 weights persist across restarts.
      # NOTE: served from /path/to/hf-cache (world-readable) and mounted
      # at /opt/hf-cache (NOT /root/.cache) because the image's /root is 0700
      # root-owned — the non-root container user (rmi, uid 999) cannot traverse
      # into /root to reach the mount point. HF_HOME is set to /opt/hf-cache.
      - /path/to/hf-cache:/opt/hf-cache:ro
    environment:
      - QDRANT_URL=http://rmi-qdrant:6333
      - QDRANT_HOST=rmi-qdrant
      - QDRANT_PORT=6333
      - REDIS_HOST=rmi-redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-RMI_PROD_REDIS_2026}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-}
      - LANGFUSE_HOST=http://rmi-langfuse:3000
      - OTEL_ENABLED=true
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://rmi-otel-collector:4317
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - HF_HOME=/opt/hf-cache
      - RERANK_MODEL=bge-reranker-v2-m3
      - RERANK_MODEL_NAME=BAAI/bge-reranker-v2-m3
      # DuckDB query endpoint (/api/v1/rag/query) — B2 permanence snapshots.
      # B2_APPLICATION_KEY_ID / B2_APPLICATION_KEY are required for the
      # endpoint; B2_S3_ENDPOINT defaults to s3.us-east-005.backblazeb2.com.
      # Supplied via env_file (.env.rag) — no bare .env in the repo (fleet
      # no-env-files hook; secrets sourced from gopass).
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: "1g"
        reservations:
          cpus: "0.5"
          memory: "512m"
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; r = httpx.get('http://localhost:8012/ready'); exit(0 if r.status_code == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── Threat ingest (one-shot) ────────────────────────────────────
  rag-ingest:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rmi-rag-ingest
    restart: "no"
    profiles:
      - ingest
    networks:
      - rmi_network
    environment:
      - QDRANT_URL=http://rmi-qdrant:6333
      - QDRANT_HOST=rmi-qdrant
      - QDRANT_PORT=6333
      - REDIS_HOST=rmi-redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-RMI_PROD_REDIS_2026}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-}
      - LANGFUSE_HOST=http://rmi-langfuse:3000
      - OTEL_ENABLED=true
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://rmi-otel-collector:4317
      - HF_HOME=/opt/hf-cache
    volumes:
      - /path/to/hf-cache:/opt/hf-cache:ro
    command: python scripts/ingest_threats.py
    labels:
      - app.rugmunch.io/name=rmi-rag-ingest
      - app.rugmunch.io/role=worker
      - app.rugmunch.io/description=RAG ingestion worker
