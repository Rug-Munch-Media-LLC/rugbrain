name: Gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sast:
    runs-on: docker-x64
    container: {image: "nikolaik/python-nodejs:python3.11-nodejs22"}
    defaults: {run: {working-directory: "."}}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {fetch-depth: 0}
      # The ruleset is PINNED per language. Never `--config=auto`: auto needs the
      # metrics/registry handshake and aborts under `--metrics=off` with
      # "[ERROR] Cannot create auto config when metrics are off" (exit 2) before
      # scanning one file — that is what made every sast gate red.
      - name: Semgrep
        env: {LANGUAGE: "python"}
        run: |
          set -eu
          python3 -m pip install --quiet --disable-pip-version-check semgrep
          if [ "$LANGUAGE" = "python" ]; then ruleset=p/python; else ruleset=p/default; fi
          # PR gate: report the findings THIS change introduces. Pre-existing findings
          # are debt with their own ledger; failing here would block a PR on code it
          # never touched. A finding on a changed line still fails — no threshold moved.
          base=""
          if [ -n "${GITHUB_BASE_REF:-}" ] && git rev-parse -q --verify "origin/${GITHUB_BASE_REF}" >/dev/null 2>&1; then
            base=$(git merge-base HEAD "origin/${GITHUB_BASE_REF}" || true)
          fi
          if [ -z "$base" ] && [ "${GITHUB_EVENT_NAME:-}" != "pull_request" ]; then
            git rev-parse -q --verify HEAD~1 >/dev/null 2>&1 && base=$(git rev-parse HEAD~1) || base=""
          fi
          echo "semgrep ruleset=$ruleset baseline=${base:-none (full scan)}"
          if [ -n "$base" ]; then
            semgrep scan --config="$ruleset" --severity=ERROR --error --metrics=off \
              --baseline-commit="$base" --exclude=node_modules --exclude=.venv --exclude=docs \
              --sarif --output=semgrep.sarif
          else
            semgrep scan --config="$ruleset" --severity=ERROR --error --metrics=off \
              --exclude=node_modules --exclude=.venv --exclude=docs --sarif --output=semgrep.sarif
          fi
  summary:
    if: always()
    needs: [sast]
    runs-on: docker-x64
    container: {image: "nikolaik/python-nodejs:python3.11-nodejs22"}
    steps:
      - name: Aggregate
        env:
          R_SAST: ${{ needs.sast.result }}
        run: |
          set -eu
          fail=0
          check() {
            name="$1"; result="$2"
            echo "gate $name: result=$result"
            case "$result" in
              success) ;;
              *) echo "::error::gate $name failed ($result)"; fail=1 ;;
            esac
          }
          check sast "$R_SAST"
          if [ "$fail" -ne 0 ]; then echo "GATES RED (enabled gates listed above)"; exit 1; fi
          echo "ALL ENABLED GATES GREEN"
