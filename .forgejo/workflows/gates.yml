name: Gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sast:
    runs-on: docker-x64
    container: {image: "nikolaik/python-nodejs:python3.11-nodejs22"}
    defaults: {run: {working-directory: "."}}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Semgrep
        run: |
          set -eu
          python3 -m pip install --quiet --disable-pip-version-check semgrep
          semgrep scan --config=auto --severity=ERROR --error --metrics=off \
            --exclude=node_modules --exclude=.venv --exclude=docs --sarif --output=semgrep.sarif
  deps:
    runs-on: docker-x64
    container: {image: "nikolaik/python-nodejs:python3.11-nodejs22"}
    defaults: {run: {working-directory: "."}}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: OSV-Scanner
        run: |
          set -eu
          command -v curl >/dev/null 2>&1 || { apt-get update -qq && apt-get install -y -qq --no-install-recommends curl ca-certificates; }
          curl -fsSL -o /usr/local/bin/osv-scanner \
            https://github.com/google/osv-scanner/releases/download/v1.9.2/osv-scanner_linux_amd64
          chmod +x /usr/local/bin/osv-scanner
          osv-scanner --recursive --skip-git .
  summary:
    if: always()
    needs: [sast, deps]
    runs-on: docker-x64
    container: {image: "nikolaik/python-nodejs:python3.11-nodejs22"}
    steps:
      - name: Aggregate
        env:
          R_SAST: ${{ needs.sast.result }}
          R_DEPS: ${{ needs.deps.result }}
        run: |
          set -eu
          fail=0
          check() {
            name="$1"; result="$2"
            echo "gate $name: result=$result"
            case "$result" in
              success) ;;
              *) echo "::error::gate $name failed ($result)"; fail=1 ;;
            esac
          }
          check sast "$R_SAST"
          check deps "$R_DEPS"
          if [ "$fail" -ne 0 ]; then echo "GATES RED (enabled gates listed above)"; exit 1; fi
          echo "ALL ENABLED GATES GREEN"
