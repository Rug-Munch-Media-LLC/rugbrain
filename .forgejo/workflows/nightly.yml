# Scheduled gates moved out of the per-push path 2026-10-25.
# Identical job bodies; the schedule owns them so a push is not charged
# their job-slots against the ~1.3 job-slot/run budget.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Fleet-standard commit convention gate (was missing — rmi-rag was the
  # only OSS repo without it; ops:/security:/migrate types allowed).
  commitlint:
    runs-on: docker-x64
    container:
      # node-only slim image lacks git — commitlint shells out to `git merge-base`.
      image: nikolaik/python-nodejs:python3.12-nodejs22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Install commitlint
        run: npm install -g @commitlint/cli @commitlint/config-conventional
      - name: Validate all commits in PR
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git log --format="%H %s" origin/main..HEAD | while read hash msg; do
              echo "$hash $msg" | commitlint --from="$hash^" --to="$hash" || exit 1
            done
          else
            npx commitlint --from=HEAD~1 --to=HEAD
          fi

  docker-lint:
    runs-on: docker-x64
    container:
      image: nikolaik/python-nodejs:python3.12-nodejs22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # JS actions (checkout) need node; the hadolint image has none — install
      # the binary instead of using it as the job container.
      - name: Install hadolint
        run: |
          curl -sSfL "https://github.com/hadolint/hadolint/releases/download/v2.15.1/hadolint-linux-x86_64" -o /usr/local/bin/hadolint
          chmod +x /usr/local/bin/hadolint
      - name: Hadolint Dockerfile
        run: hadolint --failure-threshold error Dockerfile

  # ── Container scan (trivy) ────────────────────────────────────
  container-scan:
    runs-on: docker-x64
    container:
      image: nikolaik/python-nodejs:python3.12-nodejs22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install trivy
        run: |
          curl -sSfL "https://github.com/aquasecurity/trivy/releases/download/v0.74.0/trivy_0.74.0_Linux-64bit.tar.gz" | tar xz -C /usr/local/bin trivy
      - name: Trivy scan Dockerfile
        run: trivy fs --severity CRITICAL,HIGH --exit-code 1 .

  decoupled:
    runs-on: docker-x64
    container:
      image: nikolaik/python-nodejs:python3.12-nodejs22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: pip install -r requirements.txt
      - name: Verify no app.* imports
        # Anchored to real import statements — the old unanchored grep
        # matched DOCSTRINGS mentioning "from app.x import y" (import_guard,
        # main) and failed spuriously.
        run: |
          ! grep -rn -E "^\s*(from app[.\s]|import app\b)" src/rugbrain/ --include="*.py" | grep -v compat.py | grep -v "_legacy" | grep -v ".pyc"
# Append these jobs under `jobs:` in any repo's ci.yml. Self-contained.
  supply-chain:
    runs-on: docker-x64
    container:
      image: nikolaik/python-nodejs:python3.11-nodejs22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Install scanners
        run: |
          apt-get update && apt-get install -y --no-install-recommends curl git ca-certificates && rm -rf /var/lib/apt/lists/*
          curl -sSfL https://github.com/google/osv-scanner/releases/download/v2.5.1/osv-scanner_linux_amd64 -o /usr/local/bin/osv-scanner && chmod +x /usr/local/bin/osv-scanner
          curl -sSfL https://github.com/trufflesecurity/trufflehog/releases/download/v3.97.0/trufflehog_3.97.0_linux_amd64.tar.gz | tar xz -C /usr/local/bin trufflehog
      - name: OSV dependency scan (hallucinated/vulnerable deps)
        run: osv-scanner scan source --format table ./ || echo "::warning::OSV findings — triaged baseline, see log"
      - name: Trufflehog verified-live secrets (all history)
        run: trufflehog git file://. --only-verified --fail --no-update

  nightly-deep-scan:
    if: ${{ github.event_name == 'schedule' }}
    runs-on: docker-x64
    container:
      image: nikolaik/python-nodejs:python3.11-nodejs22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Noseyparker full-history secret hunt
        run: |
          curl -sSfL https://github.com/praetorian-inc/noseyparker/releases/download/v0.24.0/noseyparker-v0.24.0-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./noseyparker-v0.24.0-x86_64-unknown-linux-gnu/noseyparker scan --git-history-format all . || true
          ./noseyparker-v0.24.0-x86_64-unknown-linux-gnu/noseyparker report || true
      - name: Grype vulnerability match on working tree
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
          grype dir:. --fail-on critical || echo "::warning::critical vulns in tree"

  nightly-api-fuzz:
    if: ${{ github.event_name == 'schedule' }}
    runs-on: docker-x64
    container:
      image: nikolaik/python-nodejs:python3.11-nodejs22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Schemathesis property-based API fuzzing (live OpenAPI)
        run: |
          pip install schemathesis
          st run --url "${SCHEMA_URL:-http://rmi-backend:8000/openapi.json}" --checks all --max-examples 50 || echo "::warning::API contract violations found"

  # ── SBOM (CycloneDX) ──────────────────────────────────────────
  # Generates a source-tree SBOM with syft (via anchore/sbom-action) and
  # verifies it is a parseable CycloneDX document before upload.
  sbom:
    runs-on: docker-x64
    container:
      image: nikolaik/python-nodejs:python3.12-nodejs22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Generate SBOM (CycloneDX)
        # pinned: v0 resolves to a node24 release; this runner supports <= node20
        uses: anchore/sbom-action@v0.21.0
        with:
          format: cyclonedx-json
          output: sbom.cyclonedx.json
      - name: Verify SBOM (blocking — bad SBOM = broken gate)
        run: |
          python3 - <<'EOF'
          import json
          with open('sbom.cyclonedx.json') as f:
              sbom = json.load(f)
          assert sbom.get('bomFormat') == 'CycloneDX', 'not a CycloneDX document'
          print(f"SBOM OK — {len(sbom.get('components', []))} components")
          EOF
      - uses: actions/upload-artifact@v5.0.0
        with:
          name: sbom
          path: sbom.cyclonedx.json

  # ── Sign image (cosign keyless, main only) ──────────────────
  # Mirrors the rmi-backend sign-image gate. Preconditions (fleet infra):
  # the docker-x64 job container mounts the Docker socket, the
  # registry.rugmunch.io hostname resolves from the runner, and Forgejo
  # OIDC issues workflow tokens for this repo (git.rugmunch.io issuer).
  sign-image:
    runs-on: docker-x64
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.4.3'
      - name: Set up Docker BuildKit
        run: |
          echo "DOCKER_BUILDKIT=1" >> $GITHUB_ENV
          echo "BUILDKIT_PROGRESS=plain" >> $GITHUB_ENV
      - name: Pull build cache
        run: docker pull registry.rugmunch.io/rugbrain:buildcache || echo "No cache image yet — building from scratch"
      - name: Build Docker image with cache
        run: |
          docker build \
            --cache-from registry.rugmunch.io/rugbrain:buildcache \
            --build-arg BUILDKIT_INLINE_CACHE=1 \
            -t registry.rugmunch.io/rugbrain:${{ github.sha }} \
            .
      - name: Push cache image
        run: |
          docker tag registry.rugmunch.io/rugbrain:${{ github.sha }} registry.rugmunch.io/rugbrain:buildcache
          docker push registry.rugmunch.io/rugbrain:buildcache
      - name: Push release image
        run: docker push registry.rugmunch.io/rugbrain:${{ github.sha }}
      - name: Sign image with keyless (OIDC)
        run: |
          cosign sign --yes registry.rugmunch.io/rugbrain:${{ github.sha }}
        env:
          COSIGN_EXPERIMENTAL: "1"
      - name: Verify signature
        run: |
          cosign verify \
            --certificate-identity "https://git.rugmunch.io/RugMunchMedia/rugbrain/.forgejo/workflows/ci.yml@refs/heads/main" \
            --certificate-oidc-issuer "https://git.rugmunch.io" \
            registry.rugmunch.io/rugbrain:${{ github.sha }}
        env:
          COSIGN_EXPERIMENTAL: "1"

  # ── Dependency vulnerability audit (pip-audit) ───────────────
  # Mirrors the rmi-backend gate. BLOCKING on HIGH/CRITICAL.
  # Installs the same way the quality job does (no apt needed — the
  # nikolaik image ships build tooling) so success conditions match.
  pip-audit:
    runs-on: docker-x64
    container:
      image: nikolaik/python-nodejs:python3.12-nodejs22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pip-audit + deps
        run: |
          pip install pip-audit
          pip install -r requirements.txt
      - name: Run pip-audit (blocking on HIGH/CRITICAL)
        run: |
          pip-audit --fail-on=high --desc 2>&1 || { echo "❌ pip-audit found HIGH/CRITICAL vulnerabilities — fix before merge"; exit 1; }

  # ── Dependency freshness (libyear) ───────────────────────────
  deps-freshness:
    runs-on: docker-x64
    continue-on-error: true  # advisory — flags drift, never blocks
    container:
      image: nikolaik/python-nodejs:python3.11-nodejs22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check dependency freshness
        run: |
          pip install pip-tools libyear 2>/dev/null || true
          if [ -f requirements.txt ]; then
            libyear --file requirements.txt || echo "Dep freshness check noted"
          fi

  # ── Mutation testing (mutmut) ────────────────────────────────
  # Informational only for now. Path scope + pytest selection come from
  # [tool.mutmut] in pyproject.toml (source_paths = src/rugbrain).
  mutation-test:
    runs-on: docker-x64
    continue-on-error: true  # informational only for now
    container:
      image: nikolaik/python-nodejs:python3.12-nodejs22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install deps + mutmut
        run: |
          pip install -r requirements.txt
          pip install -e . mutmut
      - name: Mutation testing (scoped to src/rugbrain)
        run: mutmut run --test-timeout 10 || echo "Mutation score noted (non-blocking)"
      - uses: actions/upload-artifact@v5.0.0
        if: always()
        with:
          name: mutation-report
          path: |
            .mutmut-cache/
            html/
          include-hidden-files: true
