name: Release

on:
  push:
    branches: [main]

jobs:
  release-please:
    runs-on: docker-x64
    steps:
      - uses: actions/checkout@v4
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release-type: python
          package-name: rmi-rag
