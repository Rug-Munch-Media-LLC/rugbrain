name: CI
on: [push, pull_request]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pip install ruff mypy pytest pytest-cov
      - run: ruff check src/ tests/
      - run: mypy src/rugbrain/ --ignore-missing-imports || true
      - run: pytest tests/ -v --tb=short --cov=rugbrain --cov-report=term-missing || true

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: pip install gitleaks
      - run: gitleaks detect --no-git -v
      - run: pip install bandit
      - run: bandit -r src/rugbrain/ -x tests

  decoupled:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Verify no app.* imports
        run: |
          ! grep -rn "from app\|import app" src/rugbrain/ --include="*.py" | grep -v compat.py | grep -v "_legacy" | grep -v ".pyc"
