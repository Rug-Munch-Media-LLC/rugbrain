name: CI
on: [push, pull_request]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history: the per-diff coverage gate (diff-cover) needs
          # origin/main as the diff base.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # Install the package itself so --cov=rugbrain resolves deterministically.
      - run: pip install -e .
      - run: pip install ruff mypy pytest pytest-cov diff-cover
      - run: ruff check src/ tests/
      # mypy gate is owned by a separate workstream — kept non-blocking here
      # until the strict-strict cleanup lands (do not change without owner).
      - run: mypy src/rugbrain/ --ignore-missing-imports || true
      - name: Unit tests with coverage (BLOCKING)
        # Tests MUST pass and global coverage must meet the 60% floor
        # declared in pyproject.toml [tool.coverage.report] fail_under.
        # Integration-marked tests need live external services — excluded.
        run: |
          pytest tests/ -v --tb=short -m "not integration" \
            --cov=rugbrain \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-report=lcov:coverage.lcov \
            --cov-fail-under=60
      - name: Per-diff coverage gate (diff-cover — covgate-equivalent for Python)
        # Ratchet: lines CHANGED vs origin/main must be >=60% covered.
        # covgate (the Rust CLI used by frontend repos) does not parse Python
        # coverage output; diff-cover provides the same per-diff gate here.
        # On pushes to main the diff is empty and this passes trivially.
        run: diff-cover coverage.xml --compare-branch=origin/main --fail-under=60
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: coverage-report
          path: |
            coverage.xml
            coverage.lcov

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - run: pip install gitleaks
      - run: gitleaks detect --no-git -v
      - run: pip install bandit
      - run: bandit -r src/rugbrain/ -x tests

  decoupled:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Verify no app.* imports
        run: |
          ! grep -rn "from app\|import app" src/rugbrain/ --include="*.py" | grep -v compat.py | grep -v "_legacy" | grep -v ".pyc"
# Append these jobs under `jobs:` in any repo's ci.yml. Self-contained.
  supply-chain:
    runs-on: docker-x64
    container:
      image: nikolaik/python-nodejs:python3.11-nodejs22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Install scanners
        run: |
          apt-get update && apt-get install -y --no-install-recommends curl git ca-certificates && rm -rf /var/lib/apt/lists/*
          curl -sSfL https://github.com/google/osv-scanner/releases/latest/download/osv-scanner_linux_amd64 -o /usr/local/bin/osv-scanner && chmod +x /usr/local/bin/osv-scanner
          curl -sSfL https://github.com/trufflesecurity/trufflehog/releases/download/v3.97.0/trufflehog_3.97.0_linux_amd64.tar.gz | tar xz -C /usr/local/bin trufflehog
      - name: OSV dependency scan (hallucinated/vulnerable deps)
        run: osv-scanner scan source --format table ./ || echo "::warning::OSV findings — triaged baseline, see log"
      - name: Trufflehog verified-live secrets (all history)
        run: trufflehog git file://. --only-verified --fail --no-update

  nightly-deep-scan:
    if: ${{ github.event_name == 'schedule' }}
    runs-on: docker-x64
    container:
      image: nikolaik/python-nodejs:python3.11-nodejs22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Noseyparker full-history secret hunt
        run: |
          curl -sSfL https://github.com/praetorian-inc/noseyparker/releases/latest/download/noseyparker-v0.24.0-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./noseyparker-v0.24.0-x86_64-unknown-linux-gnu/noseyparker scan --git-history-format all . || true
          ./noseyparker-v0.24.0-x86_64-unknown-linux-gnu/noseyparker report || true
      - name: Grype vulnerability match on working tree
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
          grype dir:. --fail-on critical || echo "::warning::critical vulns in tree"

  nightly-api-fuzz:
    if: ${{ github.event_name == 'schedule' }}
    runs-on: docker-x64
    container:
      image: nikolaik/python-nodejs:python3.11-nodejs22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Schemathesis property-based API fuzzing (live OpenAPI)
        run: |
          pip install schemathesis
          st run --url "${SCHEMA_URL:-http://rmi-backend:8000/openapi.json}" --checks all --max-examples 50 || echo "::warning::API contract violations found"
