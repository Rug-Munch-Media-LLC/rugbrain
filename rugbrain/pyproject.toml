[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rugbrain"
version = "0.1.0"
description = "RugBrain — a hybrid retrieval RAG engine (dense + sparse, RRF fusion) for self-hosted knowledge bases"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["rag", "retrieval", "qdrant", "hybrid-search", "embedding"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "qdrant-client>=1.13.0",
    "httpx>=0.27.0",
    "redis>=5.2.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "numpy>=1.26.0,<2.0",
]

[project.optional-dependencies]
crawl = ["crawl4ai>=0.9.0"]
api = ["fastapi>=0.115.0", "uvicorn[standard]>=0.30.0"]
dev = [
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.21.0",
    "qdrant-client[local]>=1.13.0",
]

[project.scripts]
rugbrain = "rugbrain.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["rugbrain*"]

[tool.setuptools.package-data]
rugbrain = ["config/*.json", "examples/data/*.md"]

[tool.ruff]
line-length = 120  # port parity: extracted verbatim from a 120-col codebase
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
# Line length is formatter-enforced (fleet ruff-base standard); E501 is
# disabled so verbatim-ported modules from the 120-col private codebase pass.
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.ruff.lint.per-file-ignores]
# evaluation.py keeps its RAG_EVAL_* gate imports after the docstring block
# (mirrors the private source layout).
"src/rugbrain/core/evaluation.py" = ["E402"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: requires external services (Qdrant/Infinity)",
]
